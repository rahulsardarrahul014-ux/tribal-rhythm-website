    <style>
        /* 🌌 BODY */
        body {
            margin: 0;
            min-height: 100vh;
            /* 🔥 important */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial;
            background: linear-gradient(135deg, #000814, #001d3d, #003566);

            overflow-y: auto;
            /* ✅ scroll allow */
            padding: 20px 0;
            /* ✅ top-bottom spacing */
        }

        /* 🌟 BACKGROUND GLOW */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent);
            top: -100px;
            left: -100px;
            filter: blur(80px);
            animation: moveGlow 10s infinite alternate;
        }

        @keyframes moveGlow {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(200px, 200px);
            }
        }

        /* 💎 CARD */
        .card-box {
            width: 380px;
            padding: 30px;
            border-radius: 22px;
            max-height: 90vh;
            /* 🔥 screen ke andar fit */
            overflow-y: auto;

            /* 🔥 FIXED GRADIENT */
            /* background: linear-gradient(135deg, #FFD700, #1E90FF); */

            color: white;
            text-align: center;
            position: relative;

            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);

            /* 💎 CLEAN SHADOW */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

            transition: 0.4s;
        }

        .card-box::-webkit-scrollbar {
            width: 5px;
        }

        .card-box::-webkit-scrollbar-thumb {
            background: gold;
            border-radius: 10px;
        }

        .card-box {
            background: linear-gradient(135deg,
                    rgba(255, 215, 0, 0.85),
                    rgba(30, 144, 255, 0.85));
        }

        /* 🔥 GLOW BORDER (BEHIND CONTENT) */


        @keyframes borderGlow {
            0% {
                background-position: 0%
            }

            100% {
                background-position: 300%
            }
        }

        /* 💡 SHINE EFFECT (BEHIND CONTENT) */


        .card-box:hover::after {
            left: 100%;
            transition: 0.7s;
        }

        /* 🚀 HOVER */
        .card-box:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6),
                0 0 35px rgba(255, 215, 0, 0.8);
        }

        /* ✅ CONTENT ABOVE EFFECTS */
        .card-box * {
            position: relative;
            z-index: 2;
        }

        /* 🖼 LOGO (FIXED) */
        .logo {
            width: 70px;
            display: block;
            margin: 0 auto 10px;
        }

        /* 📝 INPUT */
        input,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(6px);
            caret-color: #FFD700;
        }

        select option {
            background: #001d3d;
            color: #FFD700;
            /* 🔥 golden text */
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ✨ INPUT FOCUS */
        input:focus,
        select:focus {
            border-color: #FFD700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.7),
                0 0 25px rgba(255, 215, 0, 0.4);
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.03);
        }

        /* 🎯 HOVER */
        input:hover,
        select:hover {
            border-color: #FFD700;
        }

        /* 🔘 BUTTON */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;

            background: linear-gradient(135deg, #FFD700, #FFC107);
            color: #222;

            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.5);
            transition: all 0.3s ease;
        }

        /* 🚀 BUTTON HOVER */
        button:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(135deg, #FFC107, #FFD700);
            box-shadow: 0 8px 25px rgba(255, 193, 7, 0.7);
        }

        /* 💫 CLICK */
        button:active {
            transform: scale(0.96);
        }

        /* 🎨 VARIANTS */
        .otp-btn {
            background: linear-gradient(135deg, #FFD700, #FFB300);
        }

        .verify-btn {
            background: linear-gradient(135deg, #E6C200, #FFD700);
        }

        .resend {
            background: linear-gradient(135deg, #D4AF37, #FFC107);
        }

        /* 📱 MOBILE */
        @media (max-width: 420px) {
            .card-box {
                width: 90%;
                padding: 25px;
            }

            .logo {
                width: 60px;
            }
        }

        input[type="date"] {
            color: white;
        }

        #otp {
            display: none;
        }

        .verify-btn {
            display: none;
        }

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .otp-container input {
            width: 45px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

        <!-- ================= REGISTER FORM ================= -->

            <button class="otp-btn mt-2" onclick="sendPhoneOTP()">

        </div>




        <!-- ================= LOGIN FORM ================= -->


        <div id="loginForm" style="display:none;">


            <input id="loginEmail" placeholder="Email">

                <input type="password" id="loginPassword" placeholder="Password">

                <button type="button" id="loginEye" onclick="toggleLoginPassword()" style="

    <!-- EMAIL JS -->


    <script type="module">

        let emailTime = 60;
        let phoneTime = 60;
        let emailInterval;
        let phoneInterval;
        let emailVerified = false;
        let phoneVerified = false;

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        // 🔥 FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDeXDwM5_DASJCYqefJbQ-u_B-g1MTPjXM",
            authDomain: "tribalrhythm-486bd.firebaseapp.com",
            projectId: "tribalrhythm-486bd",
            storageBucket: "tribalrhythm-486bd.firebasestorage.app",
            messagingSenderId: "566528037279",
            appId: "1:566528037279:web:b475312ea2c721d4fd2daa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.togglePassword = function () {

            let pass = document.getElementById("password");

            if (pass.type === "password") {
                pass.type = "text";
            }
            else {
                pass.type = "password";
            }

        }

        window.toggleConfirmPassword = function () {

            let pass = document.getElementById("confirmPassword");

            if (pass.type === "password") {
                pass.type = "text";
            }
            else {
                pass.type = "password";
            }

        }

        window.toggleLoginPassword = function () {

            const pass = document.getElementById("loginPassword");
            const eye = document.getElementById("loginEye");

            if (pass.type === "password") {
                pass.type = "text";
                eye.innerHTML = "🙈";
            } else {
                pass.type = "password";
                eye.innerHTML = "👁️";
            }
        };
        window.showLogin = function () {

            document.getElementById("registerForm").style.display = "none";

            document.getElementById("loginForm").style.display = "block";

            document.getElementById("formTitle").innerHTML = "Welcome Back";

        }



        window.showRegister = function () {

            document.getElementById("registerForm").style.display = "block";

            document.getElementById("loginForm").style.display = "none";

            document.getElementById("formTitle").innerHTML = "Create TribalRhythm Account";

        }


        // 🔥 CHECK EXISTING USER (by email or mobile)
        window.checkExistingUser = async function (email) {
            const docRef = doc(db, "users", email);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                return docSnap.data();
            } else {
                return null;
            }
        };


        function startEmailTimer() {
            clearInterval(emailInterval);
            emailTime = 60;

            document.getElementById("emailResendBtn").style.pointerEvents = "none";

            emailInterval = setInterval(() => {
                emailTime--;

                document.getElementById("emailTimerText").innerText = `(${emailTime})`;

                if (emailTime <= 0) {
                    clearInterval(emailInterval);
                    document.getElementById("emailResendBtn").style.pointerEvents = "auto";
                    document.getElementById("emailTimerText").innerText = "(0)";

                }
            }, 1000);
        }


        function startPhoneTimer() {
            clearInterval(phoneInterval);
            phoneTime = 60;

            document.getElementById("phoneResendBtn").style.pointerEvents = "none";

            phoneInterval = setInterval(() => {
                phoneTime--;

                document.getElementById("phoneTimerText").innerText = `(${phoneTime})`;

                if (phoneTime <= 0) {
                    clearInterval(phoneInterval);
                    document.getElementById("phoneResendBtn").style.pointerEvents = "auto";
                    document.getElementById("phoneTimerText").innerText = "(0)";
                }
            }, 1000);
        }



        const setupOTPBoxes = () => {

            document.querySelectorAll('.email-otp,.phone-otp,.pincode'
            ).forEach((box, index, arr) => {

                box.addEventListener('input', () => {

                    if (
                        box.value.length === 1 &&
                        index < arr.length - 1
                    ) {
                        arr[index + 1].focus();
                    }

                });

            });

        };

        document.getElementById("email").addEventListener("blur", async function () {
            let email = this.value.trim();
            if (!email) return;

            let userData = await checkExistingUser(email);

            if (userData) {

                Swal.fire({
                    title: "Welcome Back",
                    text: "User already registered. Please Login.",
                    icon: "success"
                }).then(() => {

                    showLogin();

                    document.getElementById("loginEmail").value = email;

                });

                return;
            }
        });

        setTimeout(setupOTPBoxes, 500);


        // 🔥 EMAILJS INIT


        // 🔐 OTP VARIABLES


        // ⏱ TIMER

        function validatePassword(password) {

            const regex =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

            return regex.test(password);
        }
        // 📧 SEND EMAIL OTP
        window.sendOTP = async function () {

            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let dob = document.getElementById("dob").value;
            let mobile = document.getElementById("mobile").value;
            let email = document.getElementById("email").value.trim();
            let state = document.getElementById("state").value;
            let language = document.getElementById("language").value;
            let rules = document.getElementById("rulesCheck").checked;

            // 🔥 validation first
            if (!name || !age || !dob || !mobile || !email || !state || !language) {
                Swal.fire("Tribal Rhythm", "Please fill all details", "warning");
                return;
            }

            if (!rules) {
                Swal.fire("Tribal Rhythm", "Please accept Rules & Regulations", "warning");
                return;
            }

            // 🔥 duplicate check
            let existing = await checkExistingUser(email);

            if (existing) {
                Swal.fire("Already Registered", "You cannot register again", "error");

                // auto fill
                document.getElementById("name").value = existing.name;
                document.getElementById("age").value = existing.age;
                document.getElementById("dob").value = existing.dob;
                document.getElementById("mobile").value = existing.mobile;
                document.getElementById("whatsapp").value = existing.whatsapp;
                document.getElementById("state").value = existing.state;
                document.getElementById("language").value = existing.language;

                document.getElementById("editBtn").style.display = "block";

                return;
            }

            // OTP generate
            const response = await fetch("https://tribal-rhythm-backend.onrender.com/send-otp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    email,
                    mobile
                })
            });

            const data = await response.json();

            if (data.success) {
                Swal.fire("Success", "OTP Sent", "success");
            } else {
                Swal.fire("Error", data.message, "error");
            }
        };



        // ✅ VERIFY EMAIL OTP
        window.verifyOTP = async function () {

            let otp = "";

            document.querySelectorAll(".email-otp")
                .forEach(input => {
                    otp += input.value;
                });

            if (otp.length !== 6) {
                Swal.fire("Error", "Enter full OTP", "warning");
                return;
            }





            try {

                let name = document.getElementById("name").value.trim();
                let age = document.getElementById("age").value.trim();
                let dob = document.getElementById("dob").value.trim();
                let mobile = document.getElementById("mobile").value.trim();
                let whatsapp = document.getElementById("whatsapp").value.trim();
                let email = document.getElementById("email").value.trim();
                let state = document.getElementById("state").value.trim();
                let language = document.getElementById("language").value.trim();
                let pincode = "";
                document.querySelectorAll(".pincode").forEach(i => pincode += i.value);



                const response = await fetch("https://tribal-rhythm-backend.onrender.com/verify-otp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        otp,
                        mobile
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    Swal.fire("Error", data.message, "error");
                    return;
                }

                localStorage.setItem("email", email);
                localStorage.setItem("ticketId", data.ticketId);

                emailVerified = true;

                Swal.fire({
                    title: "Email Verified",
                    text: "Now verify phone OTP",
                    icon: "success"
                });

                // checkFinalSuccess();



            } catch (error) {

                console.log(error);

                Swal.fire(
                    "Firebase Error",
                    error.message,
                    "error"
                );
            }
        };

        // 📱 SEND PHONE OTP
        window.sendPhoneOTP = async function () {

            const mobile = document.getElementById("mobile").value.trim();

            if (!/^[6-9]\d{9}$/.test(mobile)) {
                Swal.fire("Invalid Mobile", "Enter valid Indian mobile number", "warning");
                return;
            }

            try {

                const response = await fetch("https://tribal-rhythm-backend.onrender.com/send-phone-otp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        mobile,
                        name: document.getElementById("name").value.trim()
                    })
                });

                const data = await response.json();

                if (data.success) {

                    document.getElementById("phoneOtpBox").style.display = "flex";
                    document.getElementById("phoneVerifyBtn").style.display = "block";

                    startPhoneTimer();

                    Swal.fire("Success", "Phone OTP Sent", "success");

                } else {

                    Swal.fire("Error", data.message, "error");

                }

            } catch (err) {

                Swal.fire("Error", err.message, "error");

            }

        };



        // 📱 VERIFY PHONE OTP
        window.verifyPhoneOTP = async function () {

            let otp = "";

            document.querySelectorAll(".phone-otp").forEach(input => {
                otp += input.value;
            });

            if (otp.length !== 6) {
                Swal.fire("Error", "Enter full OTP", "warning");
                return;
            }

            const mobile = document.getElementById("mobile").value.trim();

            try {

                const response = await fetch("https://tribal-rhythm-backend.onrender.com/verify-phone-otp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        mobile,
                        otp
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    Swal.fire("Error", data.message, "error");
                    return;
                }

                phoneVerified = true;

                document.getElementById("phoneVerifyBtn").disabled = true;

                if (emailVerified && phoneVerified) {

                    document.getElementById("registerBtn").disabled = false;

                }

                Swal.fire(
                    "Verified",
                    "Phone Verified Successfully",
                    "success"
                );

            } catch (err) {

                Swal.fire("Error", err.message, "error");

            }

        };

        function checkFinalSuccess() {
            if (emailVerified && phoneVerified) {

                Swal.fire({
                    title: "🎉 Registration Complete",
                    text: "Email + Phone both verified successfully",
                    icon: "success"
                }).then(() => {
                    window.location.href = "index.html";
                });

            }
        }

        window.enableEdit = function () {
            document.querySelectorAll("input, select").forEach(el => {
                el.disabled = false;
            });

            Swal.fire("Edit Mode", "You can now update your details", "info");
        };

        window.registerUser = async function () {

            if (!emailVerified || !phoneVerified) {

                Swal.fire(
                    "Verification Required",
                    "Please verify Email and Phone OTP first",
                    "warning"
                );

                return;
            }

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!validatePassword(password)) {

                Swal.fire(
                    "Error",
                    "Password not strong enough",
                    "error"
                );

                return;
            }

            if (password !== confirmPassword) {

                Swal.fire(
                    "Error",
                    "Passwords do not match",
                    "error"
                );

                return;
            }

            try {

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                let name = document.getElementById("name").value.trim();
                let age = document.getElementById("age").value.trim();
                let dob = document.getElementById("dob").value.trim();
                let mobile = document.getElementById("mobile").value.trim();
                let whatsapp = document.getElementById("whatsapp").value.trim();
                let state = document.getElementById("state").value.trim();
                let language = document.getElementById("language").value.trim();

                let pincode = "";
                document.querySelectorAll(".pincode").forEach(input => {
                    pincode += input.value;
                });

                await setDoc(doc(db, "users", email), {
                    name,
                    age,
                    dob,
                    mobile,
                    whatsapp,
                    email,
                    state,
                    pincode,
                    language,
                    status: "active",
                    createdAt: new Date()
                }, { merge: true });

                await fetch("https://tribal-rhythm-backend.onrender.com/send-registration-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        ticketId: localStorage.getItem("ticketId")
                    })
                });

                Swal.fire({
                    title: "Registration Successful",
                    text: "Welcome to TribalRhythm",
                    icon: "success"
                }).then(() => {
                    window.location.href = "index.html";
                });

            } catch (error) {

                Swal.fire(
                    "Error",
                    error.message,
                    "error"
                );

            }
        };

        window.loginUser = async function () {

            let email =
                document.getElementById("loginEmail").value;

            let password =
                document.getElementById("loginPassword").value;

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                window.location.href =
                    "index.html";

            } catch (error) {

                Swal.fire(
                    "Login Failed",
                    error.message,
                    "error"
                );

            }
        };

        window.forgotPassword = async function () {

            let email = document.getElementById("loginEmail").value.trim();

            if (!email) {
                Swal.fire(
                    "Error",
                    "Enter Email First",
                    "warning"
                );
                return;
            }

            try {

                await sendPasswordResetEmail(auth, email);

                Swal.fire(
                    "Success",
                    "Password Reset Link Sent To Email",
                    "success"
                );

            } catch (error) {

                Swal.fire(
                    "Error",
                    error.message,
                    "error"
                );

            }
        };











    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
